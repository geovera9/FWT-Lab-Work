    <!-- FORM -->
    <h2>Student Registration Form</h2>

    <form id="stu_regi">

        <label>Name:</label>
        <input type="text" required ="name">
        <br><br>

        <label>Mobile number:</label>
        <input type="number" required name="number" id="number">
        <br><br>

        <label>Email:</label>
        <input type="email" required name="email">
        <br><br>

        <label>Password:</label>
        <input type="password" required name="password">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="optional"> Optional
        <br><br>
        

        <label>Nationality: </label>
        <input type="radio" name="nationality" value="Indian"> Indian
        <input type="radio" name="nationality" value="NRI"> NRI
        <input type="radio" name="nationality" value="Foreigner"> Foreigner
        <br><br>



        <label>Hobbies:</label>
        <input type="checkbox" name="hobby" value="reading"> Reading
        <input type="checkbox" name="hobby" value="music"> Music
        <input type="checkbox" name="hobby" value="sports"> Sports
        <input type="checkbox" name="hobby" value="photography"> Photography
        <input type="checkbox" name="hobby" value="programming"> Programming
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option>Btech Computer Science</option>
            <option>BCA</option>
            <option>BSc Computer Science</option>
            <option>MCA</option>
            <option>MSc Computer Science</option>
        </select>
        <br><br>

        <label>Address:</label>
        <br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label>Feedback:</label>
        <br>
        <textarea name="feedback" rows="2" cols="20"></textarea>
        <br><br>

        <input type="button" onclick="Register()" value="Register">
        <input type="reset" value="Clear">

    </form>
